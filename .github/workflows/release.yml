name: Release

# Builds the NUI (web/build) and publishes a ready-to-use koja-lib.zip as a
# release asset, so server owners can download it without touching git/node.
#
# Triggers:
#   - push a tag like v1.2.0 (must match `version` in fxmanifest.lua)
#   - run manually from the Actions tab (tag is taken from fxmanifest.lua)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RESOURCE_NAME: koja-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          manifest_version=$(grep -E "^version\s+'" fxmanifest.lua | sed -E "s/^version\s+'([^']+)'.*/\1/")
          if [ -z "$manifest_version" ]; then
            echo "::error::Could not read version from fxmanifest.lua"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "${tag#v}" != "$manifest_version" ]; then
              echo "::error::Tag ${tag} does not match fxmanifest.lua version ${manifest_version}"
              exit 1
            fi
          else
            tag="v${manifest_version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists - bump version in fxmanifest.lua first"
              exit 1
            fi
          fi

          echo "version=${manifest_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build NUI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package resource
        run: |
          out="dist/${RESOURCE_NAME}"
          mkdir -p "$out/web"

          cp fxmanifest.lua init.lua README.md "$out/"
          cp -r client server editable "$out/"
          cp -r web/build "$out/web/build"

          (cd dist && zip -rq "${RESOURCE_NAME}.zip" "${RESOURCE_NAME}")
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.RESOURCE_NAME }} ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/${{ env.RESOURCE_NAME }}.zip
          body: |
            ## Download

            👉 **[${{ env.RESOURCE_NAME }}.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ env.RESOURCE_NAME }}.zip)** - ready to use, NUI already built.

            > ⚠️ Do **not** download *Source code (zip)* - it does not include the built UI (`web/build`) and requires Node.js to build.

            ### Installation
            1. Download `${{ env.RESOURCE_NAME }}.zip` above.
            2. Extract it into your server's `resources` folder (the folder must be named `${{ env.RESOURCE_NAME }}`).
            3. Add `ensure ${{ env.RESOURCE_NAME }}` to `server.cfg` (after your framework and `oxmysql`).

            Full docs: https://docs.kojascripts.eu/
