name: Release

# Builds the NUI (web/build) and publishes a ready-to-use koja-lib.zip as a
# release asset, so server owners can download it without touching git/node.
#
# Triggers:
#   - push a tag like 1.2.0 (must match `version` in fxmanifest.lua)
#   - run manually from the Actions tab (tag is taken from fxmanifest.lua)

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RESOURCE_NAME: koja-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          manifest_version=$(grep -E "^version\s+'" fxmanifest.lua | sed -E "s/^version\s+'([^']+)'.*/\1/")
          if [ -z "$manifest_version" ]; then
            echo "::error::Could not read version from fxmanifest.lua"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "${tag#v}" != "$manifest_version" ]; then
              echo "::error::Tag ${tag} does not match fxmanifest.lua version ${manifest_version}"
              exit 1
            fi
          else
            tag="${manifest_version}"
            for existing in "${manifest_version}" "v${manifest_version}"; do
              if git rev-parse -q --verify "refs/tags/${existing}" >/dev/null; then
                echo "::error::Tag ${existing} already exists - bump version in fxmanifest.lua first"
                exit 1
              fi
            done
          fi

          echo "version=${manifest_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build NUI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Package resource
        run: |
          out="dist/${RESOURCE_NAME}"
          mkdir -p "$out/web"

          cp fxmanifest.lua init.lua README.md "$out/"
          cp -r client server editable "$out/"
          cp -r web/build "$out/web/build"

          (cd dist && zip -rq "${RESOURCE_NAME}.zip" "${RESOURCE_NAME}")
          ls -la dist

      - name: Release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${RESOURCE_NAME}.zip"
          {
            echo "## Download"
            echo
            echo "👉 **[${RESOURCE_NAME}.zip](${url})** - ready to use, NUI already built."
            echo
            echo "> ⚠️ Do **not** download *Source code (zip)* - it does not include the built UI (\`web/build\`) and requires Node.js to build."
            echo
            echo "### Installation"
            echo "1. Download \`${RESOURCE_NAME}.zip\` above."
            echo "2. Extract it into your server's \`resources\` folder (the folder must be named \`${RESOURCE_NAME}\`)."
            echo "3. Add \`ensure ${RESOURCE_NAME}\` to \`server.cfg\` (after your framework and \`oxmysql\`)."
            echo
            echo "Full docs: https://docs.kojascripts.eu/"
            echo
            # Section of CHANGELOG.md for this version, if there is one
            if [ -f CHANGELOG.md ]; then
              section=$(awk -v v="## [${VERSION}]" 'index($0, v) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md)
              if [ -n "$section" ]; then
                echo "## Changelog"
                echo "$section"
              fi
            fi
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.RESOURCE_NAME }} ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/${{ env.RESOURCE_NAME }}.zip
          body_path: dist/RELEASE_NOTES.md
